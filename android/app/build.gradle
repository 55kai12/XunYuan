plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 加载签名配置（key.properties 不在版本控制中）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.xunyuan.familytree"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.xunyuan.familytree"
        // 最低 Android 6.0（API 23），目标 Android 14（API 34）
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // 签名配置
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    // 这里**不要**手写 splits.abi。Flutter 的 Gradle 插件会自己配（enable / reset /
    // universalApk(false) / 按 --target-platform include），而且多做一件手写拿不到的事：
    //   output.versionCodeOverride = abiVersionCode * 1000 + variant.versionCode
    // 即给每个 ABI 包算不同的 versionCode。手写块拿不到这条，两个包 versionCode 相同，
    // 交替安装会撞版本号。这些只在传了 --split-per-abi 时才生效。
    //
    // 构建命令（README「开发」一节同步）：
    //   flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm
    //
    // --target-platform 决定编哪几个架构的 libapp.so / libflutter.so：
    //   android-arm64 = arm64-v8a（现役机型）
    //   android-arm   = armeabi-v7a（32 位老机）
    // 不给 android-x64 就不会白编一份只有模拟器用的引擎。
    // 若只给 arm64 而拆分仍开着，v7a 那个 split 会缺引擎 —— 是装不上的废包。

    buildTypes {
        release {
            // 使用 release 签名配置
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // 启用代码压缩与资源压缩
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

name: familytree
description: "寻渊 - 本地优先的中文族谱/家谱工具，寻根问祖，渊远流长"
publish_to: 'none'

# 版本号：每次交付 APK 时自动增加 0.0.1
version: 0.3.50+62

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.7

  # 本地数据库
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3

  # 备份 zip 打包
  archive: ^3.6.1
  path: ^1.9.0

  # 媒体与文件
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  share_plus: ^10.0.2

  # 导出 PDF
  pdf: ^3.11.1

  # 隐私与安全
  local_auth: ^2.3.0
  local_auth_android: ^1.0.0
  local_auth_darwin: ^1.0.0

  # 本地偏好存储
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 代码生成
  drift_dev: ^2.18.0
  build_runner: ^2.4.12

  # 应用图标生成
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7BA8A0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true

  # 资源目录
  assets:
    - assets/images/

  # 字体：霞鹜文楷（开源手写楷体，子集化仅含常用3866字符，1.7MB）
  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai.ttf
          weight: 400
